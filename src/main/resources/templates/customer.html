<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Savings Investment Record</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <style>
        .error-message { color: red; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-bottom: 20px;">Savings Investment Record</h2>

    <div th:if="${!#strings.isEmpty(message)}"
         th:id="messageBox"
         th:class="${message.contains('already existing') ? 'alert alert-danger' : 'alert alert-success'}"
         th:text="${message}">
    </div>



    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Customer number</th>
            <th>Customer Name</th>
            <th>Customer Deposit</th>
            <th>Number of years</th>
            <th>Savings Type</th>
            <th style="width: 300px;">Actions</th> </tr>
        </thead>
        <tbody>
        <tr th:each="record : ${records}">
            <td th:text="${record.customerNumber}"></td>
            <td th:text="${record.customerName}"></td>
            <td th:text="${#numbers.formatDecimal(record.customerDeposit, 1, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="${record.numberOfYears}"></td>
            <td th:text="${record.savingType}"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${record.customerNumber})}" class="btn btn-info btn-sm">Edit</a>

                <form th:action="@{/delete/{id}(id=${record.customerNumber})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure you want to delete the record?');">
                        Delete
                    </button>
                </form>

                <a th:href="@{/projected-investment/{id}(id=${record.customerNumber})}" class="btn btn-warning btn-sm">Projected Investment</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/add" class="btn btn-success" style="margin-bottom: 20px;">Add
<!--        <span class="glyphicon glyphicon-plus"></span>-->
    </a>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const messageBox = document.getElementById('messageBox');
        // Check if the message box exists
        if (messageBox) {
            // Hide the message box after 5 seconds (5000 milliseconds)
            setTimeout(() => {
                // Use Bootstrap's fade class to make it smooth, then remove it
                messageBox.classList.add('fade');
                setTimeout(() => {
                    messageBox.style.display = 'none';
                }, 500); // 500ms delay for fade effect
            }, 5000);
        }
    });
</script>

</body>
</html>
</body>
</html>
