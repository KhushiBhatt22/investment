<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projected Investment Table</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>

<div class="container">
    <h2 style="margin-bottom: 5px;">Projected Table</h2>
    <h4 th:text="'Customer Number: ' + ${customerNumber}"></h4>
    <h4 th:text="'Name: ' + ${customerName}" style="margin-bottom: 20px;"></h4>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Year</th>
            <th>Starting Amount</th>
            <th>Interest</th>
            <th>Ending Balance</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${projectionTable}">
            <td th:text="${entry.year}"></td>
            <td th:text="'$' + ${#numbers.formatDecimal(entry.startingAmount, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="'$' + ${#numbers.formatDecimal(entry.interest, 0, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="'$' + ${#numbers.formatDecimal(entry.endingBalance, 0, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        </tbody>
    </table>

    <a href="/" class="btn btn-primary" style="margin-top: 20px;">Submit</a>

</div>

</body>
</html>
