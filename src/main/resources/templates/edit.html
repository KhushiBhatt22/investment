<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Savings Record</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>

<div class="container">
    <h2 style="margin-bottom: 30px;">Edit Savings Record</h2>

    <form th:action="@{/update}" th:object="${savingsRecord}" method="post" class="form-horizontal">

        <div class="form-group">
            <label for="customerNumber" class="col-sm-3 control-label">Customer Number:</label>
            <div class="col-sm-6">
                <input type="text" th:field="*{customerNumber}" id="customerNumber" class="form-control" readonly/>
            </div>
        </div>

        <div class="form-group">
            <label for="customerName" class="col-sm-3 control-label">Customer Name:</label>
            <div class="col-sm-6">
                <input type="text" th:field="*{customerName}" id="customerName" class="form-control" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="customerDeposit" class="col-sm-3 control-label">Customer Initial Deposit:</label>
            <div class="col-sm-6">
                <input type="number" th:field="*{customerDeposit}" id="customerDeposit" class="form-control" step="0.01" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="numberOfYears" class="col-sm-3 control-label">Number of years:</label>
            <div class="col-sm-6">
                <input type="number" th:field="*{numberOfYears}" id="numberOfYears" class="form-control" required/>
            </div>
        </div>

        <div class="form-group">
            <label for="savingsType" class="col-sm-3 control-label">Savings Type:</label>
            <div class="col-sm-6">
                <select th:field="*{savingType}" id="savingsType" class="form-control" required>
                    <option value="Savings-Deluxe">Savings-Deluxe</option>
                    <option value="Savings-Regular">Savings-Regular</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-6">
                <button type="submit" class="btn btn-success">Update Record</button>
                <a href="/" class="btn btn-default">Cancel</a>
            </div>
        </div>
    </form>
</div>

</body>
</html>
